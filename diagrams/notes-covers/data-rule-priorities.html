<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:800px;overflow:hidden}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.serif{font-family:"Songti SC","STSong","Source Han Serif SC",serif}
.cover{position:relative;width:1200px;height:800px;padding:64px 72px 0;
  background:radial-gradient(1200px 800px at 24% 10%, #262012 0%, #1a150e 48%, #100d08 100%);overflow:hidden}
.sheen{position:absolute;inset:0;background:radial-gradient(900px 460px at 12% -8%, rgba(255,255,255,.07), transparent 62%)}
.eyebrow{position:absolute;top:64px;left:72px;font-size:21px;letter-spacing:.32em;color:rgba(255,255,255,.55)}
.num{position:absolute;top:52px;right:72px;font-family:"Songti SC",serif;font-style:italic;font-size:46px;color:rgba(255,255,255,.32)}
.title{position:absolute;top:158px;left:72px;width:660px}
.title .line{font-size:58px;font-weight:600;line-height:1.26;letter-spacing:.01em}
.title .accent{color:#ffb454}
.takeaway{position:absolute;top:404px;left:72px;width:600px;font-size:26px;line-height:1.6;color:rgba(255,255,255,.62)}
.hook{position:absolute;top:452px;left:72px;font-size:23px;letter-spacing:.1em;color:rgba(255,255,255,.42)}
/* 优先级条 */
.bar{position:absolute;left:72px;height:46px;border-radius:14px;display:flex;align-items:center;padding:0 28px;font-size:27px;font-weight:600;letter-spacing:.05em}
.bar .w{position:absolute;right:24px;font-size:19px;font-weight:500;opacity:.82}
.b1{top:534px;width:1056px;background:linear-gradient(90deg,#ff6b5e,#e8503f)}
.b2{top:591px;width:700px;background:linear-gradient(90deg,#ffb454,#f09a2e)}
.b3{top:648px;width:400px;background:linear-gradient(90deg,#8a857c,#6f6a61)}
.footer{position:absolute;bottom:32px;left:72px;right:72px;display:flex;justify-content:space-between;align-items:center;
  border-top:1px solid rgba(255,255,255,.14);padding-top:22px;font-size:19px;letter-spacing:.24em;color:rgba(255,255,255,.4)}
</style>
</head>
<body>
<div class="cover">
  <div class="sheen"></div>
  <div class="eyebrow">数据标注 · 文章</div>
  <div class="num">02</div>
  <div class="title serif">
    <div class="line">规则不是一碗水端平</div>
    <div class="line accent">先分清，再用力</div>
  </div>
  <div class="takeaway">资源有限时，专业不是平均用力；</div>
  <div class="hook">1000 条数据 · 10 个人 · 5 天，你会怎么分？</div>
  <div class="bar b1">安全红线 · 一票否决<span class="w">不可妥协</span></div>
  <div class="bar b2">核心场景 · 重点投入</div>
  <div class="bar b3">长尾问题 · 先放一放</div>
  <div class="footer"><span>CAIYANMING · NOTES</span><span>用产品思维拆解 AI</span></div>
</div>
</body>
</html>
